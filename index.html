<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#080B0F">

<meta name="description" content="80+ fórmulas automotivas profissionais — o guia completo para produzir e vender.">

<style>
:root{--bg:#080B0F;--bg2:#0E1117;--card:#111418;--ch:#181D24;--brd:#1E2530;--acc:#E8720C;--acl:#FFB347;--acd:#C4580A;--glo:rgba(232,114,12,0.15);--txt:#F2F4F6;--mut:#8B95A1;--dim:#4A5568;--grn:#22C55E;--blu:#3B82F6;--r:12px;--rl:18px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;direction:ltr;}
/* SPLASH */
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;}
.sp-logo{font-size:34px;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#E8720C,#FFB347);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:fu .8s ease forwards;}
.sp-sub{font-size:12px;color:var(--mut);letter-spacing:2px;text-transform:uppercase;animation:fu .8s .2s ease both;text-align:center;padding:0 32px;line-height:1.6;}
.sp-bar{width:120px;height:3px;background:var(--brd);border-radius:2px;overflow:hidden;animation:fu .8s .4s ease both;}
.sp-p{height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acl));animation:lb 1.8s .5s ease forwards;}
@keyframes lb{to{width:100%;}}@keyframes fu{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes fi{from{opacity:0;}to{opacity:1;}}@keyframes su{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
/* APP */
#app{display:flex;flex-direction:column;min-height:100vh;}
/* HEADER */
#hdr{position:sticky;top:0;z-index:100;background:rgba(8,11,15,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--brd);padding:12px 16px;display:flex;align-items:center;gap:10px;}
.hdr-logo{font-size:16px;font-weight:800;background:linear-gradient(135deg,var(--acc),var(--acl));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;flex-shrink:0;}
.hdr-search{flex:1;position:relative;}
.hdr-search input{width:100%;background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:8px 12px 8px 32px;color:var(--txt);font-size:14px;outline:none;transition:border-color .2s;cursor:pointer;direction:ltr;text-align:left;}
.hdr-search input:focus{border-color:var(--acc);}
.hdr-search input::placeholder{color:var(--dim);}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:13px;pointer-events:none;}
.hdr-acts{display:flex;gap:6px;flex-shrink:0;}
.ib{width:34px;height:34px;border-radius:8px;background:var(--card);border:1px solid var(--brd);color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;transition:all .2s;}
.ib:hover{background:var(--ch);color:var(--acc);border-color:var(--acc);}
/* MAIN */
#main{flex:1;padding-bottom:80px;}
/* BOTTOM NAV */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(8,11,15,.96);backdrop-filter:blur(16px);border-top:1px solid var(--brd);display:flex;padding:8px 0 max(8px,env(safe-area-inset-bottom));}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 4px;color:var(--dim);font-size:10px;transition:color .2s;border:none;background:none;text-decoration:none;letter-spacing:.3px;}
.ni .ico{font-size:18px;line-height:1;}
.ni.on{color:var(--acc);}
/* PROGRESS */
.pb{height:2px;background:var(--brd);}
.pf{height:100%;background:linear-gradient(90deg,var(--acc),var(--acl));transition:width .3s;}
/* HOME */
.wb{margin:16px;padding:18px;background:linear-gradient(135deg,var(--card),rgba(232,114,12,.06));border:1px solid var(--brd);border-left:3px solid var(--acc);border-radius:var(--rl);}
.wg{font-size:10px;color:var(--acc);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.wt{font-size:18px;font-weight:800;margin-bottom:6px;}
.wx{font-size:13px;color:var(--mut);line-height:1.6;}
.sl{padding:0 16px;margin:18px 0 10px;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px;}
.sl::after{content:'';flex:1;height:1px;background:var(--brd);}
/* PRODUCT CARDS (home) */
.pg{display:flex;flex-direction:column;gap:10px;padding:0 16px;}
.pc{background:var(--card);border:1px solid var(--brd);border-radius:var(--rl);padding:16px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;}
.pc::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--glo),transparent 60%);opacity:0;transition:opacity .25s;}
.pc:hover{border-color:var(--acc);transform:translateY(-1px);box-shadow:0 0 24px var(--glo);}
.pc:hover::before{opacity:1;}
.pc.lk{opacity:.85;}
.pc.lk:hover{transform:none;border-color:var(--brd);}
.pc-icon{font-size:32px;flex-shrink:0;}
.pc-body{flex:1;min-width:0;}
.pc-name{font-size:15px;font-weight:700;margin-bottom:3px;}
.pc-sub{font-size:12px;color:var(--mut);line-height:1.4;}
.pc-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;flex-shrink:0;}
.pc-badge.inc{background:var(--acc);color:#fff;}
.pc-badge.lk2{background:var(--glo);color:var(--acl);border:1px solid var(--acc);animation:pulse 2.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,114,12,.35);}50%{box-shadow:0 0 0 4px rgba(232,114,12,0);}}
.pc-hint{color:var(--acl);font-size:10.5px;font-weight:700;margin-top:6px;}
.pc-badge.unl{background:rgba(34,197,94,.2);color:var(--grn);border:1px solid rgba(34,197,94,.3);}
/* UTILITY CARDS */
.ug{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
.uc{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:14px;cursor:pointer;transition:all .2s;text-decoration:none;color:inherit;display:block;}
.uc:hover{border-color:var(--acc);transform:translateY(-1px);}
.uc-icon{font-size:24px;margin-bottom:8px;}
.uc-name{font-size:13px;font-weight:700;margin-bottom:3px;}
.uc-sub{font-size:11px;color:var(--mut);}
/* BONUS */
.bg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
.bc{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:12px;text-decoration:none;color:inherit;display:block;transition:all .2s;}
.bc:hover{border-color:var(--acl);transform:translateY(-1px);}
.bic{font-size:20px;margin-bottom:6px;}
.bn{font-size:12px;font-weight:700;margin-bottom:3px;line-height:1.3;}
.bd{font-size:11px;color:var(--mut);line-height:1.4;}
.bl{display:inline-block;margin-top:6px;font-size:10px;font-weight:700;color:var(--acc);letter-spacing:.5px;text-transform:uppercase;}
/* SUB-APP HEADER */
.sah{padding:14px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;background:rgba(8,11,15,.95);backdrop-filter:blur(12px);}
.bb{width:34px;height:34px;border-radius:8px;background:var(--card);border:1px solid var(--brd);color:var(--txt);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;flex-shrink:0;transition:all .2s;}
.bb:hover{border-color:var(--acc);}
.sat{flex:1;}
.sat-icon{font-size:18px;}
.sat-name{font-size:16px;font-weight:700;}
.sat-sub{font-size:11px;color:var(--mut);margin-top:1px;}
/* DOWNLOAD BUTTON */
.dl-wrap{padding:12px 16px;}
.dl-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:1px solid var(--brd);color:var(--txt);padding:12px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;width:100%;}
.dl-btn:hover{border-color:var(--acc);color:var(--acc);}
/* CATEGORY CARDS (inside sub-app) */
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;}
.cc{background:var(--card);border:1px solid var(--brd);border-radius:var(--rl);padding:16px 13px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;text-decoration:none;color:inherit;display:block;}
.cc::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--glo),transparent 60%);opacity:0;transition:opacity .25s;}
.cc:hover{border-color:var(--acc);transform:translateY(-2px);}
.cc:hover::before{opacity:1;}
.ci{font-size:24px;margin-bottom:8px;display:block;}
.cn{font-size:13px;font-weight:700;margin-bottom:3px;line-height:1.3;}
.ck{font-size:11px;color:var(--mut);}
/* FORMULA LIST */
.fl{padding:8px 16px;}
.fi{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:14px;margin-bottom:8px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px;}
.fi:hover{border-color:var(--acc);background:var(--ch);}
.fi.sv{border-left:3px solid var(--acc);}
.fi.vd{border-left:3px solid var(--grn);}
.fi.lk{opacity:.68;}
/* PREVIEW MODE */
.prevbar{margin:12px 16px 0;padding:12px 14px;background:linear-gradient(135deg,var(--acc),var(--acd));border-radius:var(--r);display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(232,114,12,.3);}
.prevbar-tx{flex:1;font-size:12px;font-weight:700;line-height:1.4;color:#fff;}
.prevbar-cta{background:#fff;color:var(--acd);padding:8px 14px;border-radius:20px;font-size:11px;font-weight:800;text-decoration:none;white-space:nowrap;flex-shrink:0;}
.fic{flex:1;min-width:0;}
.fit{font-size:14px;font-weight:600;margin-bottom:4px;}
.fid{font-size:12px;color:var(--mut);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.far{color:var(--dim);font-size:20px;flex-shrink:0;}
/* FORMULA DETAIL */
.fh{padding:18px 16px;border-bottom:1px solid var(--brd);background:linear-gradient(135deg,var(--card),rgba(232,114,12,.04));}
.ftm{font-size:20px;font-weight:800;line-height:1.2;margin-bottom:6px;}
.fdm{font-size:13px;color:var(--mut);line-height:1.6;}
.fav-btn{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--brd);color:var(--mut);font-size:12px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;transition:all .2s;margin-top:12px;}
.fav-btn.on{color:var(--acc);border-color:var(--acc);background:var(--glo);}
/* DETAIL SECTIONS */
.sb{padding:16px;border-bottom:1px solid var(--brd);}
.sb:last-child{border-bottom:none;}
.bt{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.bt::after{content:'';flex:1;height:1px;background:rgba(232,114,12,.2);}
.ul2{display:flex;flex-wrap:wrap;gap:6px;}
.ut2{background:var(--card);border:1px solid var(--brd);color:var(--mut);font-size:11px;padding:4px 9px;border-radius:6px;}
table.ft,table.dt{width:100%;border-collapse:collapse;}
table.ft th,table.dt th{background:var(--bg2);color:var(--mut);font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:7px 10px;text-align:left;border-bottom:1px solid var(--brd);}
table.ft td,table.dt td{padding:8px 10px;font-size:12px;border-bottom:1px solid var(--brd);vertical-align:top;}
table.ft tr:last-child td,table.dt tr:last-child td{border-bottom:none;}
table.ft tr:hover td,table.dt tr:hover td{background:var(--ch);}
table.ft td:last-child{color:var(--acl);font-weight:700;font-family:'Courier New',monospace;text-align:right;white-space:nowrap;}
.dr{font-family:'Courier New',monospace;font-weight:700;color:var(--acc);font-size:13px;}
.de{color:var(--mut);font-size:11px;}
.ifl{display:flex;flex-direction:column;gap:9px;}
.ifi{display:flex;gap:10px;}
.ifn{font-size:11px;font-weight:700;color:var(--acl);flex-shrink:0;min-width:120px;}
.ifd{font-size:12px;color:var(--mut);line-height:1.5;}
.pl{display:flex;flex-direction:column;gap:10px;}
.ps{display:flex;gap:10px;align-items:flex-start;}
.pn{width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ptx{font-size:13px;line-height:1.6;padding-top:2px;}
.wl{display:flex;flex-direction:column;gap:7px;}
.wi{display:flex;gap:9px;align-items:flex-start;background:var(--card);border-radius:8px;padding:9px 10px;border:1px solid var(--brd);}
.wic{font-size:13px;flex-shrink:0;}
.wtx{font-size:12px;color:var(--mut);line-height:1.5;}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ip{background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:10px;}
.ipl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);margin-bottom:4px;}
.ipv{font-size:12px;line-height:1.4;}
.sales{background:linear-gradient(135deg,var(--glo),transparent);border:1px solid rgba(232,114,12,.3);border-radius:var(--r);padding:13px;}
.sq{font-size:13px;font-weight:600;line-height:1.5;font-style:italic;margin-bottom:6px;}
.cn2{font-size:11px;color:var(--mut);line-height:1.5;}
/* LEGALIZAÇÃO */
.lg-card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:15px;margin-bottom:8px;cursor:pointer;transition:all .2s;display:flex;align-items:flex-start;gap:12px;}
.lg-card:hover{border-color:var(--blu);background:var(--ch);}
.lg-num{width:28px;height:28px;border-radius:50%;background:var(--blu);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lg-body{flex:1;}
.lg-title{font-size:14px;font-weight:700;margin-bottom:3px;}
.lg-sub{font-size:12px;color:var(--mut);line-height:1.4;}
/* EXCLUSIVA */
.ex-box{margin:16px;padding:20px;background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(139,92,246,.04));border:1px solid rgba(139,92,246,.3);border-radius:var(--rl);}
.ex-step{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start;}
.ex-num{width:28px;height:28px;border-radius:50%;background:rgba(139,92,246,.8);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ex-txt{font-size:13px;line-height:1.6;padding-top:4px;}
.ex-msg{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:14px;margin:0 16px 14px;font-size:13px;line-height:1.7;color:var(--mut);}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#25D366;color:#fff;padding:14px;border-radius:var(--r);font-size:15px;font-weight:700;text-decoration:none;margin:0 16px;transition:opacity .2s;}
.wa-btn:hover{opacity:.9;}
/* SEARCH */
#search-wrap{padding:14px 16px;border-bottom:1px solid var(--brd);}
#search-inp{width:100%;background:var(--card);border:1px solid var(--acc);border-radius:8px;padding:12px 14px 12px 36px;color:var(--txt);font-size:15px;outline:none;direction:ltr;text-align:left;unicode-bidi:embed;}
#search-icon{position:absolute;left:26px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none;}
#search-results{min-height:200px;animation:fi .2s ease;}
/* GLOSSARY */
.gs{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--brd);}
.gs input{width:100%;background:var(--card);border:1px solid var(--brd);border-radius:8px;padding:10px 13px;color:var(--txt);font-size:14px;outline:none;direction:ltr;}
.gs input:focus{border-color:var(--acc);}
.gw{overflow-x:auto;}
table.gt{width:100%;border-collapse:collapse;min-width:560px;}
table.gt th{background:var(--bg2);color:var(--mut);font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:7px 10px;text-align:left;border-bottom:1px solid var(--brd);}
table.gt td{padding:8px 10px;font-size:11px;border-bottom:1px solid var(--brd);vertical-align:top;}
table.gt tr:hover td{background:var(--ch);}
.gn{font-weight:700;color:var(--txt);font-size:12px;}
.gm{color:var(--mut);}
.gp{color:var(--acl);font-weight:600;white-space:nowrap;}
/* SUPPLIERS */
.sr{padding:10px 16px 4px;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);}
.sc{margin:0 16px 7px;background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:12px;}
.sn{font-size:13px;font-weight:700;margin-bottom:2px;}
.sct{font-size:11px;color:var(--mut);margin-bottom:3px;}
.sco{font-size:11px;color:var(--mut);}
/* EMPTY */
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 32px;text-align:center;}
.ei{font-size:44px;margin-bottom:12px;opacity:.5;}
.et{font-size:17px;font-weight:700;margin-bottom:6px;}
.ex2{font-size:13px;color:var(--mut);line-height:1.5;}
/* WA FLOAT BTN */
.wa-float{position:fixed;bottom:88px;right:14px;z-index:200;width:48px;height:48px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;text-decoration:none;box-shadow:0 4px 16px rgba(37,211,102,.4);transition:transform .2s;}
.wa-float:hover{transform:scale(1.08);}
/* INSTALL */
#ip{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px;}
#ip.open{display:flex;}
.ip-box{background:var(--card);border:2px solid var(--acc);border-radius:var(--rl);padding:22px 18px;width:100%;max-width:440px;animation:su .3s ease;box-shadow:0 0 50px var(--glo);}
.ip-title{font-size:16px;font-weight:800;margin-bottom:5px;text-align:center;}
.ip-sub{font-size:12px;color:var(--mut);text-align:center;margin-bottom:18px;}
.ip-tabs{display:flex;gap:8px;margin-bottom:14px;}
.ip-tab{flex:1;padding:8px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--brd);background:var(--bg2);color:var(--mut);text-align:center;transition:all .2s;}
.ip-tab.on{background:var(--acc);color:#fff;border-color:var(--acc);}
.ip-steps{display:flex;flex-direction:column;gap:9px;margin-bottom:16px;}
.ip-step{display:flex;gap:10px;align-items:flex-start;}
.ip-n{width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ip-t{font-size:12px;line-height:1.5;padding-top:3px;}
.ip-close{width:100%;padding:11px;background:var(--bg2);border:1px solid var(--brd);border-radius:8px;color:var(--mut);font-size:13px;font-weight:600;cursor:pointer;}
/* PRINT */
@media print{body{background:#fff;color:#000;}#hdr,#nav,.wa-float,#ip,.fav-btn{display:none!important;}.ftm,.bt{color:#E8720C;}.pn{background:#E8720C;}}
/* RESPONSIVE */
@media(min-width:768px){.cg{grid-template-columns:repeat(3,1fr);}#main{max-width:768px;margin:0 auto;}.wa-float{bottom:22px;right:22px;}#nav{display:none;}}
</style>
</head>
<body>

<div id="splash">

const LG=[{"id": "lg01", "num": "1", "title": "Os 3 Caminhos para Começar", "icon": "🛣️", "desc": "Revenda, marca própria terceirizada e fabricação própria — vantagens, limitações e como escolher para o seu momento atual.", "content": "Os três modelos de negócio para quem quer vender produtos de limpeza e automotivos:\n\n1. REVENDA — O mais fácil. Você compra produtos prontos de um fabricante e revende com a sua marca ou a dele. Menor custo de entrada, sem estrutura de produção, mas margens menores e dependência do fornecedor.\n\n2. MARCA PRÓPRIA TERCEIRIZADA — O intermediário. Você contrata um fabricante para produzir com a sua marca. Você é o responsável legal pelo produto, mas não produz fisicamente. Precisa de CNPJ, regularização e contrato com o fabricante.\n\n3. FABRICAÇÃO PRÓPRIA — O mais completo. Você produz tudo. Maior controle de qualidade e melhores margens, mas exige infraestrutura, regularização completa e possivelmente um Responsável Técnico.\n\n💡 Recomendação: comece com revenda ou marca terceirizada para validar o mercado antes de investir em estrutura própria."}, {"id": "lg02", "num": "2", "title": "Venda Antes de Fabricar", "icon": "💡", "desc": "Como validar o produto e começar a vender antes de montar toda a estrutura legal — a estratégia mais inteligente.", "content": "A sequência certa para quem está começando:\n\n1. Teste o produto com sua rede — amigos, família, conhecidos próximos\n2. Colete feedback honesto sobre qualidade, perfume e embalagem\n3. Valide se as pessoas pagariam o preço que você precisa cobrar\n4. Com feedback positivo e primeiras vendas, invista na formalização\n5. Abra o MEI ou ME — processo simples e rápido\n6. Regularize os produtos conforme escala a produção\n\n⚠️ Você pode vender para pessoas físicas como PF por um período curto enquanto regulariza. Não emita nota fiscal sem CNPJ e não venda para CNPJ sem nota.\n\nO erro mais comum: montar toda a estrutura legal e de produção ANTES de validar se o produto vende. Isso gera custos e frustração desnecessários."}, {"id": "lg03", "num": "3", "title": "O Que Você Pode Vender", "icon": "📋", "desc": "Saneantes Risco 1 e Risco 2 — o que cada categoria significa na prática e quais produtos são indicados para iniciar.", "content": "Produtos de limpeza e automotivos são regulados pela ANVISA como saneantes. Há dois níveis:\n\nRISCO 1 — Notificação (mais simples):\n• Sabão líquido e em pó\n• Detergente e lava-louças\n• Amaciante e alvejante sem cloro e sem alegação bactericida\n• Shampoo automotivo, limpa vidros e limpadores neutros (confirme na VISA local o enquadramento dos automotivos)\n• Limpa vidros, multiuso, limpa piso\n• Aromatizantes e desodorizadores\n\nRISCO 2 — Registro (mais complexo):\n• Desinfetantes e qualquer produto com alegação bactericida/antimicrobiana\n• Água sanitária e alvejantes à base de hipoclorito (cloro ativo 2,0 a 2,5% p/p)\n• Produtos com pH < 2 ou > 11,5 (ácidos e álcalis fortes)\n• Inseticidas, repelentes e raticidas\n\nConfirme sempre o enquadramento do seu produto na RDC 59/2010 e RDC 40/2008 ou com a VISA local.\n\n✅ Recomendação para iniciantes: Comece com Risco 1. São mais fáceis de regularizar, cobrem a maioria dos produtos do guia e têm mercado enorme."}, {"id": "lg04", "num": "4", "title": "Notificação ANVISA Passo a Passo", "icon": "📝", "desc": "11 passos detalhados para notificar seu produto no sistema Solicita — do cadastro ao protocolo final.", "content": "O processo de notificação de saneantes Risco 1 no sistema Solicita:\n\n1. Abra uma empresa (MEI ou ME) — CNPJ é obrigatório\n2. Acesse solicita.anvisa.gov.br e crie seu cadastro com CNPJ\n3. Escolha a opção Saneante → Notificação → Risco 1\n4. Preencha os dados do produto: nome comercial, composição (ingredientes), finalidade e modo de usar\n5. Informe os dados do fabricante: CNPJ, endereço completo\n6. Adicione o rótulo do produto (PDF) — deve ter todas as informações obrigatórias\n7. Pague a GRU (taxa ANVISA) — valor varia por categoria e porte. MEI tem redução\n8. Protocole e aguarde a análise (30 a 60 dias úteis para Risco 1)\n9. Receba o número de notificação por e-mail\n10. Inclua o número de notificação no rótulo de todos os lotes\n11. Guarde toda a documentação — laudos, fichas técnicas e comprovantes\n\n💡 A notificação não é permanente — tem prazo de validade. Acompanhe pelo sistema."}, {"id": "lg05", "num": "5", "title": "Rótulo Certo desde o Início", "icon": "🏷️", "desc": "Informações obrigatórias, erros mais comuns em fiscalização e checklist completo para não ser autuado.", "content": "O rótulo é o documento mais fiscalizado. Um rótulo errado gera autuação mesmo com produto regularizado.\n\nINFORMAÇÕES OBRIGATÓRIAS:\n✅ Nome do produto e marca\n✅ Número de notificação ou registro ANVISA (ex: Notificação ANVISA nº XXXXXXXXX)\n✅ CNPJ e endereço completo do fabricante/responsável\n✅ Composição completa (todos os ingredientes)\n✅ Finalidade de uso (para que serve)\n✅ Modo de usar (como aplicar)\n✅ Precauções e avisos de segurança\n✅ Capacidade do conteúdo (volume em ml ou peso em g)\n✅ Número de lote\n✅ Data de fabricação\n✅ Validade ou prazo de validade\n✅ Frases de segurança quando aplicável\n\nERROS MAIS COMUNS:\n❌ Falta o número de notificação ANVISA\n❌ Composição incompleta ou com nomes errados\n❌ Não tem data de fabricação ou validade\n❌ Informações de contato erradas ou desatualizadas"}, {"id": "lg06", "num": "6", "title": "Responsável Técnico", "icon": "👨‍🔬", "desc": "Quando você precisa de RT, quando não precisa e as opções para quem está começando.", "content": "O Responsável Técnico (RT) é um profissional habilitado (químico, farmacêutico, engenheiro químico ou biólogo) que assina a responsabilidade técnica pelos produtos.\n\nQUANDO É OBRIGATÓRIO:\n• Produtos de Risco 2 (registrados)\n• Empresas com AFE (Autorização de Funcionamento)\n• Produção em escala industrial\n• Exportação de produtos\n\nQUANDO GERALMENTE NÃO É OBRIGATÓRIO:\n• Produtos de Risco 1 notificados por MEI\n• Pequena produção artesanal\n• Revendedores de produtos já regularizados\n\nOPÇÕES PARA NÃO CONTRATAR FIXO:\n• RT por prestação de serviços (freela) — muitos profissionais atendem PMEs por projeto ou mensalidade\n• Parceria com laboratório que já tem RT\n• Contratar a produção de um terceirista que tem RT\n\n💡 Contrate o RT somente quando realmente necessário — é um custo fixo relevante para quem está começando."}, {"id": "lg07", "num": "7", "title": "Abrindo Sua Empresa", "icon": "🏢", "desc": "MEI, ME ou EPP — qual abrir, CNAEs corretos e passo a passo de abertura sem complicação.", "content": "MEI (Microempreendedor Individual):\n• Limite: R$ 81.000/ano (R$ 6.750/mês)\n• Tributação: valor fixo mensal baixo\n• Abertura: portal.gov.br/mei — grátis e em minutos\n• Ideal para: quem está validando o negócio\n\nME (Microempresa):\n• Limite: R$ 360.000/ano\n• Tributação: Simples Nacional\n• Ideal para: quem já vende bem e precisa de nota fiscal para CNPJ\n\nCNAE CORRETOS para fabricação de limpeza:\n• 20.61-4/00 — Fabricação de sabões e detergentes sintéticos\n• 20.62-2/00 — Fabricação de produtos de limpeza e polimento\n• 46.49-4/99 — Comércio atacadista de produtos de higiene e limpeza\n• 47.72-5/00 — Comércio varejista de cosméticos e higiene\n\nPASSO A PASSO MEI:\n1. Acesse gov.br/mei\n2. Informe CPF e data de nascimento\n3. Selecione a atividade (CNAE)\n4. Preencha os dados e emita o CCMEI\n5. Abra conta bancária PJ\n6. Instale o aplicativo MEI para emitir notas"}, {"id": "lg08", "num": "8", "title": "Licença Sanitária e AFE", "icon": "📜", "desc": "Quem precisa, como obter e o que muda por estado e município.", "content": "LICENÇA SANITÁRIA:\n• Emitida pela Vigilância Sanitária municipal ou estadual\n• Necessária para todo estabelecimento que produz, armazena ou distribui produtos regulados\n• Processo varia por município — consulte a VISA local\n• Prazo: geralmente 30 a 90 dias após vistoria\n• Renovação anual ou conforme prazo do estado\n\nAFE — AUTORIZAÇÃO DE FUNCIONAMENTO DE EMPRESA:\n• Emitida pela ANVISA via sistema Solicita\n• Obrigatória para fabricantes e importadores de saneantes\n• Necessita de RT fixo para emissão\n• Não é necessária para revendedores ou terceirizados\n\nALVARÁ DE FUNCIONAMENTO:\n• Emitido pela prefeitura municipal\n• Necessário para toda empresa com atividade comercial\n• Geralmente obtido junto com o registro municipal\n\nSEQUÊNCIA RECOMENDADA:\n1. CNPJ (MEI/ME)\n2. Alvará de funcionamento (prefeitura)\n3. Licença sanitária (VISA local)\n4. AFE da ANVISA (quando obrigatória)\n5. Notificação dos produtos"}, {"id": "lg09", "num": "9", "title": "Checklist Final e Plano de 30 Dias", "icon": "✅", "desc": "3 checklists por modelo de negócio + plano de ação semana a semana para sair do zero ao legal.", "content": "PLANO DE 30 DIAS:\n\nSemana 1 — VALIDAR:\n☐ Produza amostras dos seus 3 a 5 primeiros produtos\n☐ Distribua para 10 a 20 pessoas da sua rede\n☐ Colete feedback sincero sobre qualidade e preço\n☐ Defina o modelo de negócio (revenda, terceirizado ou próprio)\n\nSemana 2 — FORMALIZAR:\n☐ Abra o MEI em portal.gov.br/mei (gratuito)\n☐ Escolha os CNAEs corretos para a sua atividade\n☐ Abra conta bancária PJ\n☐ Instale o app MEI para emissão de notas\n\nSemana 3 — REGULARIZAR:\n☐ Crie os rótulos com todas as informações obrigatórias\n☐ Monte as fichas técnicas de cada produto\n☐ Solicite a licença sanitária na VISA local\n☐ Inicie as notificações ANVISA pelo Solicita\n\nSemana 4 — LANÇAR:\n☐ Defina preços e margens (use a Calculadora de Lucro)\n☐ Crie as embalagens finais\n☐ Divulgue nos grupos e redes sociais\n☐ Comece a vender com nota fiscal\n\n💡 Dica final: Perfeito é inimigo do bom. Comece vendendo e vá regularizando no processo. O importante é começar."}];

function _fapDoLogin(){
  var btn=document.getElementById('fap-eb'),ee=document.getElementById('fap-ee'),ei=document.getElementById('fap-ei');
  var email=(ei?ei.value:'').trim().toLowerCase();
  if(!email){if(ee)ee.textContent='Digite seu email';return;}
  if(btn){btn.textContent='Verificando...';btn.disabled=true;}
  if(ee)ee.textContent='';
  fetch('/api/login?email='+encodeURIComponent(email),{cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.success){
        localStorage.setItem('fap_email',email);
        _fapApplyPerms(d.permissions);
      }else{
        if(ee)ee.textContent=d.error||'Email não encontrado';
        if(btn){btn.textContent='Acessar →';btn.disabled=false;}
      }
    })
    .catch(function(){
      if(ee)ee.textContent='Erro de conexão. Tente novamente.';
      if(btn){btn.textContent='Acessar →';btn.disabled=false;}
    });
}

// ── EVENT BINDING ──────────────────────────────────────────────────
function bindCommon(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    // Avoid double-binding
    if(el._bound)return;
    el._bound=true;
    el.addEventListener('click',handleClick);
  });
  const gi=$('gi');
  if(gi)gi.addEventListener('input',e=>{
    const q=e.target.value.toLowerCase();
    document.querySelectorAll('#gb tr').forEach(r=>{
      r.style.display=r.textContent.toLowerCase().includes(q)?'':'none';
    });
  });
}

function handleClick(e){
  const el=e.currentTarget,ac=el.dataset.action;
  switch(ac){
    case'go': go(el.dataset.v);break;
    case'upsell': {
      const key=el.dataset.key;
      if(key&&!S.access[key]&&CHECKOUT_URLS[key]){
        _fapPixel('InitiateCheckout',{content_name:key});
        window.open(CHECKOUT_URLS[key],'_blank');
      }
      break;
    }
    case'track-checkout': {
      _fapPixel('InitiateCheckout',{content_name:el.dataset.produto||''});
      try{localStorage.setItem('fap_buy_intent','1');}catch(e){}
      setTimeout(function(){if(S.preview)render();},400);
      break; // navegação padrão do <a href target=_blank> acontece normalmente
    }
    case'download-pdf': {
      const produto=el.dataset.produto;
      const hasAcc=S.access[produto]||S.access.admin;
      if(!hasAcc){
        alert('Esse PDF fica disponível depois da compra. Desbloqueie o acesso completo para baixar.');
        return;
      }
      const prevTxt=el.textContent;
      el.textContent='Baixando...';el.disabled=true;
      const email=localStorage.getItem('fap_email')||'';
      const tk=S.access.admin?'ADMIN_FAP_2024':'';
      fetch('/api/download?produto='+encodeURIComponent(produto)+'&email='+encodeURIComponent(email)+(tk?'&token='+tk:''),{cache:'no-store'})
        .then(function(r){ if(!r.ok)throw new Error('fail'); return r.blob(); })
        .then(function(blob){
          const url=URL.createObjectURL(blob);
          const a=document.createElement('a');
          a.href=url;a.download=PDF_NAMES[produto]||'documento.pdf';
          document.body.appendChild(a);a.click();a.remove();
          setTimeout(function(){URL.revokeObjectURL(url);},2000);
          el.textContent=prevTxt;el.disabled=false;
        })
        .catch(function(){
          alert('Não foi possível baixar agora. Tente novamente ou fale com o suporte.');
          el.textContent=prevTxt;el.disabled=false;
        });
      break;
    }
    case'auto-cat': go('auto-cat',{autoCat:el.dataset.cat});break;
    case'auto-form': go('auto-form',{autoForm:el.dataset.id,autoCat:el.dataset.cat||S.autoCat});break;
    case'limp-cat': go('limp-cat',{limpCat:el.dataset.cat});break;
    case'limp-form': go('limp-form',{limpForm:el.dataset.id,limpCat:el.dataset.cat||S.limpCat});break;
    case'leg-cap': go('legal-cap',{legCap:el.dataset.id});break;
    case'back-cat': go(el.dataset.view,{autoCat:el.dataset.cat,limpCat:el.dataset.cat});break;
    case'fav': togFav(el.dataset.id,e);break;
    case'ip-tab': S.instTab=el.dataset.tab;S._instTabManual=true;renderInstTabs();break;
  }
}

  if(escolha.outcome==='accepted'){
    closeInst();
  }
  dP=null;
}

function detectaNavegadorApp(){
  const ua=navigator.userAgent||'';
  const isInstagram=/Instagram/i.test(ua);
  const isFacebook=/FBAN|FBAV|FB_IAB/i.test(ua);
  const isWhatsApp=/WhatsApp/i.test(ua);
  const isLine=/Line\//i.test(ua);
  const isTikTok=/TikTok|BytedanceWebview/i.test(ua);
  if(isInstagram)return'Instagram';
  if(isFacebook)return'Facebook';
  if(isWhatsApp)return'WhatsApp';
  if(isTikTok)return'TikTok';
  if(isLine)return'Line';
  return null;
}

function renderInstTabs(){
  const box=$('ip-box');
  if(!box)return;

  // Se o navegador oferece instalação nativa (Android/Chrome/Edge), mostra botão de 1 toque
  if(dP){
    box.innerHTML=`
    <div class="ip-title">📲 Instalar no Celular</div>
    <div class="ip-sub">Acesse offline, sem internet, igual a um app</div>
    <div style="text-align:center;padding:24px 0 8px">
      <div style="font-size:44px;margin-bottom:14px">⚡</div>
      <p style="font-size:13px;color:var(--mut);margin-bottom:18px">Seu navegador já suporta instalação com 1 toque.</p>
    </div>
    <button class="ip-close" style="background:linear-gradient(135deg,var(--acc),var(--acd));color:#fff;border:none;font-weight:700;margin-bottom:10px" onclick="installNativo()">📲 Instalar Agora</button>
    <button class="ip-close" onclick="closeInst()">Agora não</button>`;
    return;
  }

  // Sem prompt nativo disponível — mostra passo a passo (obrigatório no iPhone/Safari)
  const ios=S.instTab==='ios';
  const appDetectado=detectaNavegadorApp();
  const avisoAppInterno=(ios&&appDetectado)?`
    <div style="background:rgba(232,114,12,.12);border:1px solid var(--acc);border-radius:10px;padding:12px 14px;margin-bottom:16px;text-align:left">
      <div style="font-size:12px;font-weight:800;color:var(--acl);margin-bottom:6px">⚠️ Você está no navegador do ${appDetectado}</div>
      <div style="font-size:12px;color:var(--txt);line-height:1.5">O ${appDetectado} não permite instalar apps. Toque nos <b>●●●</b> ou <b>⋯</b> (menu, geralmente no canto superior direito) e escolha <b>"Abrir no Safari"</b> ou <b>"Abrir no navegador"</b> antes de continuar.</div>
    </div>
  `:'';
  const steps=ios?[
    'Confirme que está usando o <b>Safari</b> (obrigatório no iPhone — não funciona no navegador do WhatsApp/Instagram)',
    'Toque no ícone <b>⬆</b> na barra inferior',
    'Toque em <b>"Adicionar à Tela de Início"</b>',
    'Confirme com <b>Adicionar</b> — ícone aparece na tela!',
  ]:[
    'Abra este link no <b>Google Chrome</b>',
    'Toque nos 3 pontos <b>⋮</b> no canto superior',
    'Toque em <b>"Instalar aplicativo"</b>',
    'Confirme com <b>Instalar</b> — ícone aparece na tela!',
  ];
  box.innerHTML=`
  <div class="ip-title">📲 Instalar no Celular</div>
  <div class="ip-sub">Acesse offline, sem internet, igual a um app</div>
  <div class="ip-tabs">
    <div class="ip-tab${ios?' on':''}" data-action="ip-tab" data-tab="ios">🍎 iPhone</div>
    <div class="ip-tab${!ios?' on':''}" data-action="ip-tab" data-tab="and">🤖 Android</div>
  </div>
  ${avisoAppInterno}
  <div class="ip-steps">${steps.map((s,i)=>`<div class="ip-step"><div class="ip-n">${i+1}</div><div class="ip-t">${s}</div></div>`).join('')}</div>
  <button class="ip-close" onclick="closeInst()">Entendi ✓</button>`;
  document.querySelectorAll('[data-action="ip-tab"]').forEach(el=>{
    el._bound=false;el.addEventListener('click',handleClick);
  });
}

let dP=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  dP=e;
  if($('ip')&&$('ip').classList.contains('open'))renderInstTabs();
});
window.addEventListener('appinstalled',()=>{dP=null;});

function init(){
  S.access=parseAccess();
  setTimeout(function(){
    var sp=document.getElementById('splash'),ap=document.getElementById('app');
    if(sp){sp.style.opacity='0';sp.style.transition='opacity .5s';}
    setTimeout(function(){
      if(sp)sp.style.display='none';
      // Sem acesso — mostra tela de login OU retoma/inicia o Modo Prévia
      if(!S.access.base&&!S.access.admin){
        var pParams=new URLSearchParams(location.search);
        if(!S.preview&&pParams.get('preview')==='1'){
          // Chegou direto de um link "conheça a plataforma" (ex: da PV) — pula a tela de escolha
          _fapStartPreview();
          return;
        }
        if(S.preview){
          if(ap)ap.removeAttribute('hidden');
          render();
          _fapPixel('ViewContent',{content_name:'Fórmula Auto Pro - Modo Prévia',content_category:'preview_mode'});
          setTimeout(_fapBgRefresh,1000);
          return;
        }
        _fapShowLogin();
        return;
      }
      if(ap)ap.removeAttribute('hidden');
      render();
      var standalone=window.matchMedia('(display-mode:standalone)').matches||navigator.standalone;
      if(!standalone&&!localStorage.getItem('fap_inst_shown')){
        setTimeout(openInst,1500);
        localStorage.setItem('fap_inst_shown','1');
      }
      // Background refresh — atualiza permissões sem bloquear nada
      setTimeout(_fapBgRefresh,1000);
    },520);
  },2000);
  document.querySelectorAll('.ni').forEach(el=>{
    el.addEventListener('click',()=>{const v=el.dataset.v;if(v)go(v);});
  });
  $('hdr-logo')?.addEventListener('click',()=>go('home'));
  $('hdr-s-btn')?.addEventListener('click',()=>go('search'));
  $('hdr-f-btn')?.addEventListener('click',()=>go('favs'));
  $('hdr-inst-btn')?.addEventListener('click',openInst);
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}
document.addEventListener('DOMContentLoaded',init);

o · **cor** diferente\n\nEscreva uma delas (ex.: "meu produto ficou ralo") que eu te explico as causas. Se não resolver, o João te orienta direto — leve: **qual fórmula, quanto fez, o que usou de ingrediente (marca) e o que aconteceu**. 💬',chips:["Meu produto ficou ralo","Produto separou/turvo","Muita espuma","Falar com o João"],btns:["wa"]},{id:"elogio",t:"Quero elogiar / dar sugestão",q:["quero elogiar","sugestão","sugerir fórmula","queria uma fórmula nova","tem como adicionar uma fórmula","feedback","reclamação","quero reclamar","tenho uma sugestão","adoraria ter","poderiam fazer"],k:["sugestão","reclamação","elogio"],a:"Que bom receber isso! 😊 Elogios, sugestões de fórmulas e reclamações vão direto para o João — manda no WhatsApp **"+o+"** que ele lê. Ideias dos alunos ajudam a decidir o que entra nas próximas atualizações.",btns:["wa"]},{id:"epi",t:"Cuidados de segurança",q:["cuidados de segurança","preciso de luva","equipamento de proteção","usar máscara","segurança na produção","é perigoso","epi","óculos de proteção","proteção ao fabricar","posso fazer sem luva","é tóxico","fazer em casa é seguro","ventilação","quais cuidados ao fabricar"],k:["segurança","luvas","epi"],a:'Segurança em primeiro lugar! 🥽 Ao produzir:\n\n• Use **luvas, óculos de proteção e máscara** (principalmente com soda, ácidos, cloro e pós finos).\n• Trabalhe em local **ventilado**, longe de crianças, animais e comida.\n• **Nunca misture produtos por conta própria** (veja "o que nunca misturar").\n• Use recipientes limpos e de plástico/inox; **rotule tudo**.\n• Teste em **lote pequeno** antes de fazer grande quantidade.\n• Leia o **cuidados** de cada fórmula no app.',chips:["O que nunca misturar","Ordem de adição dos ingredientes","E se eu me queimar?"]},{id:"nunca_misturar",t:"O que nunca misturar",q:["o que nunca misturar","posso misturar água sanitária com vinagre","misturar cloro com amônia","misturar produtos de limpeza","misturar ácido com cloro","misturar alvejante","posso juntar dois produtos","misturar desinfetante com água sanitária","gás tóxico","misturar soda com ácido","misturar água sanitária com álcool","cloro com ácido","misturei e deu fumaça"],k:["misturar","gás tóxico","água sanitária"],a:"⚠️ **Nunca misture por conta própria:**\n\n• **Água sanitária/cloro + ácidos** (vinagre, ácido muriático, limpa-pedras, removedores) → libera **gás cloro**, muito tóxico.\n• **Água sanitária + amônia** (ou limpa-vidros com amônia) → gases tóxicos.\n• **Água sanitária + álcool** → gera substâncias irritantes e perigosas.\n• **Ácido forte + soda** → reação violenta com calor.\n\nUse **somente as combinações das fórmulas do curso**, na ordem indicada. Se sentir cheiro forte, saia do local, ventile e procure ar fresco.",chips:["E se eu me queimar?","Ordem de adição dos ingredientes"]},{id:"acidente",t:"E se eu me queimar?",q:["e se eu me queimar","queimou a pele","respingou no olho","irritou a pele","engoli produto","inalei gás","acidente com produto químico","intoxicação","primeiros socorros","criança tomou produto","cheiro forte passei mal","tontura com cheiro","queimadura química","respirei vapor"],k:["queimadura","intoxicação","acidente","socorro"],a:"🚨 **Em caso de acidente, aja já:**\n\n• **Pele/olhos:** lave com **água corrente em abundância por pelo menos 15 minutos** e retire roupas contaminadas.\n• **Inalação:** vá para um local arejado.\n• **Ingestão:** **não provoque vômito**; leve a embalagem/rótulo.\n\nLigue para o **Disque-Intoxicação: 0800 722 6001** (24h, gratuito) ou **SAMU: 192**, ou vá a um pronto-socorro. Em seguida, se quiser, avise o João.",btns:[{l:"Ligar Disque-Intoxicação",url:"tel:08007226001"}]},{id:"ordem_adicao",t:"Ordem de adição dos ingredientes",q:["ordem de adição dos ingredientes","qual ingrediente coloco primeiro","ácido na água ou água no ácido","como dissolver a soda","ordem de misturar","o que adiciono primeiro","posso misturar tudo junto","em que ordem misturo","dissolver soda cáustica","colocar tensoativo antes da água","a ordem importa"],k:["ordem","dissolver soda"],a:"A **ordem importa**. Regras de ouro (e siga sempre a sequência de cada fórmula):\n\n1. Comece pela **água** no tanque.\n2. **Ácidos e soda:** adicione sempre **o produto na água, devagar** — nunca água sobre ácido/soda concentrados (a reação esquenta e respinga).\n3. **Tensoativo (espumante):** acrescente **aos poucos e devagar** para não formar espuma demais.\n4. **Sal:** por último de espessar, **aos poucos**, testando a viscosidade.\n5. **Essência, corante e conservante** no final, com a mistura já homogênea.\n6. Misture **lentamente** e deixe **descansar** antes de medir o pH e envasar.",chips:["Meu produto ficou ralo","Muita espuma","Como medir o pH?"]},{id:"ph",t:"Como medir o pH?",q:["como medir o ph","qual o ph ideal","fita de ph","preciso de phmetro","o que é ph","ph do produto","ph de limpeza","ph ideal do multiuso","como saber se o ph está certo","medidor de ph","o ph está fora","ph muito alto","ph muito baixo","como corrigir o ph","como baixar o ph","como subir o ph","ajustar ph","neutralizar"],k:["ph","phmetro","fita de ph"],a:"O **pH** diz se o produto é ácido (baixo) ou alcalino (alto). Para produtos de limpeza geral (multiuso, detergente, sabão), o ideal costuma ficar **entre 6 e 8** — cada fórmula informa o valor-alvo.\n\n**Como medir:** use **fita de pH** (barata e prática) ou um **pHmetro** (mais preciso). Meça com a mistura já homogênea e descansada.\n\n**Como corrigir:**\n• pH **alto** → adicione **ácido cítrico** (solução diluída) aos poucos.\n• pH **baixo** → adicione **solução de soda** bem diluída, devagar, mexendo e medindo a cada ajuste.\n\nSempre com luvas e óculos, e em passos pequenos.",chips:["Cuidados de segurança","Ordem de adição dos ingredientes"]},{id:"ralo",neg:!0,t:"Meu produto ficou ralo",q:["meu produto ficou ralo","ficou aguado","não engrossou","como engrossar","como deixar mais grosso","ficou muito líquido","produto fino demais","viscosidade baixa","aumentar a viscosidade","o detergente não engrossa","o shampoo ficou ralo","perdeu a viscosidade","ficou mais ralo depois de colocar sal","sal engrossar"],k:["ralo","engrossar","viscosidade"],a:'Para **engrossar**, o ajuste clássico é o **sal (cloreto de sódio)**, mas com técnica:\n\n• Adicione **aos poucos**, mexendo bem e **testando a cada adição**.\n• ⚠️ Acima de ~**1%** o efeito **inverte** e o produto fica **mais ralo** — esse é o erro mais comum!\n• A viscosidade final só aparece depois de **descansar** (algumas horas).\n• Alguns produtos precisam de outro espessante (ex.: goma xantana, HEC) — veja no glossário.\n• Água em excesso, tensoativo fraco ou pouco tensoativo também deixam ralo.\n\nTem uma fórmula específica em mente? Me diga o nome e eu mostro os "erros comuns" dela.',chips:["O que é goma xantana?","Muita espuma"]},{id:"espuma",t:"Muita espuma / pouca espuma",q:["muita espuma","espuma demais","não faz espuma","pouca espuma","como reduzir espuma","espuma na hora de misturar","espumou muito","como aumentar a espuma","o produto não espuma","espuma no tanque","espuma não baixa","antiespumante"],k:["espuma"],a:"**Espuma demais na produção:** adicione o tensoativo **devagar**, com a pá rente à parede do recipiente e agitação suave, sem bater. Deixe a espuma **descansar/baixar** antes de continuar. Em lotes maiores, misture em **rotação baixa**.\n\n**Pouca espuma:** confira se usou o **tensoativo certo e na quantidade da fórmula** (LESS 27% vs 70% mudam a quantidade!), se a água é muito dura (use o **EDTA**) e se a dosagem de sal está correta.\n\nFórmulas de limpeza pesada ou de chão podem ser de **baixa espuma de propósito**.",chips:["O que é EDTA?","LESS 27% e 70%: qual a diferença?"]},{id:"turvo",neg:!0,t:"Produto separou / turvo",q:["produto separou","ficou turvo","ficou leitoso","apareceram grumos","talhou","o produto ficou em duas fases","depósito no fundo","precipitou","ficou embaçado","borra no fundo","separação de fases","ficou com grumo","flocos no produto","por que turvou"],k:["separou","turvo","grumos","precipitou"],a:"Produto **turvo, separado ou com grumos** quase sempre vem de um destes motivos:\n\n• **Ordem errada** de adição ou mistura rápida demais.\n• **Sal em excesso** ou adicionado de uma vez.\n• **Água dura** (use o sequestrante **EDTA**) — prefira água filtrada/deionizada.\n• **Essência/perfume sem solubilizante** — fragrâncias oleosas precisam de um tensoativo não iônico/solubilizante.\n• Ingredientes **frios ou mal dissolvidos** (dissolva pós em água morna à parte).\n• pH fora da faixa.\n\nRefaça em lote pequeno corrigindo um fator por vez. Se quiser, me diga a fórmula e o que viu.",chips:["Essência não mistura","Como medir o pH?"]},{id:"essencia",t:"Essência não mistura",q:["essência não mistura","fragrância separa","essência boia","como misturar essência","perfume não dissolve","óleo essencial não mistura","essência fica em cima","essência cortou o produto","quanto de essência usar","solubilizar essência","a essência desandou o produto"],k:["essência","fragrância","solubilizar"],a:"Essências são oleosas e podem boiar ou turvar o produto. Para misturar bem:\n\n• **Misture a essência com um pouco do tensoativo/solubilizante** (ex.: não iônico) **antes** de colocar no tanque.\n• Adicione no **final**, com o produto já pronto e homogêneo, sob agitação suave.\n• Respeite a **dosagem da fórmula** — excesso de essência faz turvar e pode alterar a viscosidade.\n• Prefira essências **próprias para base aquosa/limpeza**.\n\nCada fórmula informa as fragrâncias indicadas e a quantidade.",chips:["Produto separou/turvo","Fórmulas com fragrância"]},{id:"cheiro",neg:!0,t:"Cheiro ruim / produto estragou",q:["cheiro ruim","produto está com mau cheiro","azedou","mofo no produto","apareceu mofo","produto estragou","cheiro de podre","fedendo","bolhas no frasco","inchou o frasco","produto com fungo","bactéria no produto","cheiro de azedo","por que estraga","cheiro estranho","o cheiro mudou","cheiro diferente"],k:["mau cheiro","mofo","azedou","estragou"],a:"Cheiro ruim, mofo ou frasco estufando indicam **contaminação**. As causas mais comuns:\n\n• **Faltou conservante** (ou dose errada) — ele evita mofo e bactérias.\n• Água, balde, tanque ou frasco **mal higienizados**.\n• Produto armazenado **aberto**, no calor ou ao sol.\n\n**Para evitar:** higienize tudo antes (lave e enxágue bem), use **conservante na dose da fórmula**, envase em embalagem limpa e bem fechada. Produto contaminado **não deve ser vendido** — descarte e refaça com a higiene reforçada.",chips:["O que é conservante?","Validade do produto"]},{id:"conservante",t:"O que é conservante?",q:["o que é conservante","preciso de conservante","qual conservante usar","posso não usar conservante","quanto de conservante","para que serve o conservante","conservante é obrigatório","conservante de produto de limpeza","sem conservante estraga"],k:["conservante"],a:'O **conservante** protege o produto de **mofo, fungos e bactérias**, principalmente em produtos com muita água (sabão líquido, detergente, amaciante, shampoo). Sem ele, o produto pode azedar ou criar limo em poucos dias.\n\nUse sempre na **dose indicada na fórmula**, adicionando no final. Produtos muito ácidos, alcalinos ou com alto teor de álcool/cloro são menos propensos, mas siga a fórmula. Veja mais no **glossário** (pergunte "o que é Kathon" ou "benzoato de sódio").',chips:["Cheiro ruim / produto estragou","Validade do produto"]},{id:"validade",t:"Validade do produto",q:["validade do produto","quanto tempo dura","prazo de validade","quanto tempo o produto dura","vence","tempo de prateleira","posso estocar quanto tempo","data de validade no rótulo","qual validade colocar","durabilidade"],k:["validade","prateleira","durabilidade"],a:"A validade depende da **fórmula, do conservante, da higiene e do armazenamento** — não existe um número único. Para vender, o ideal é fazer **testes de estabilidade** do seu lote e definir a validade com base neles (o Guia de Legalização explica o que colocar no rótulo).\n\nPara durar mais: **conservante na dose certa, embalagem limpa e bem fechada**, local **fresco e ao abrigo do sol**.",chips:["Como armazenar?","Rótulo"]},{id:"armazenar",t:"Como armazenar?",q:["como armazenar","onde guardar o produto","como guardar","armazenamento","posso deixar no sol","guardar matéria-prima","estoque dos insumos","como estocar","local de armazenamento","guardar no calor"],k:["armazenar","guardar","estocar"],a:"Boas práticas de armazenamento:\n\n• Local **fresco, seco, ventilado e ao abrigo do sol**.\n• Embalagens **bem fechadas e rotuladas** (nome + data de fabricação + cuidados).\n• **Nunca** guarde em garrafas de bebida/alimento.\n• Separe **ácidos, soda e cloro** uns dos outros.\n• Longe de **crianças, animais e alimentos**.\n• Insumos: mantenha nas embalagens originais, bem tampadas.",chips:["Cuidados de segurança","Validade do produto"]},{id:"embalagem",t:"Que embalagem usar?",q:["que embalagem usar","qual frasco","onde comprar embalagem","frascos para envasar","galão","tipo de embalagem","garrafa pet serve","embalagem para shampoo","embalagem para perfume","embalagem para vender","envase","como envasar","tampa dosadora","pulverizador"],k:["embalagem","envasar","frasco"],a:'A embalagem depende do produto — **cada fórmula traz a sugestão** (veja "Fragrância, Cor e Embalagem" dentro dela). De forma geral:\n\n• Use embalagens **novas ou muito bem higienizadas**, de **plástico (PET/PEAD) compatível** com o produto.\n• **Nunca** reaproveite embalagens de alimento/bebida.\n• Para ácidos e cloro, use embalagens **adequadas e resistentes**.\n• O **rótulo** precisa estar correto para vender (veja o Guia de Legalização).\n\nFornecedores de embalagens estão na lista do app.',chips:["Fornecedores","Rótulo"]},{id:"equipamentos",t:"Que equipamentos preciso?",q:["que equipamentos preciso","o que preciso para começar a fabricar","preciso de balança","que utensílios","material para produzir","qual recipiente usar","tanque de inox","misturador","agitador","posso misturar à mão","pode usar balde","lista de materiais","o que comprar para fazer","investimento inicial"],k:["equipamentos","utensílios","balança","balde","misturador"],a:"Para começar em **lotes pequenos**, o básico é:\n\n• **Balança** (de preferência de precisão, 1 g ou menos) e **medidores/seringas**\n• **Recipiente** de plástico (PEAD) ou inox, limpo, com marcação de litros\n• **Pá/colher** de plástico ou inox para misturar **devagar**\n• **Fita de pH**\n• **EPIs:** luvas, óculos e máscara\n• Funil, peneira e **embalagens** limpas\n\nEvite recipientes de **alumínio ou ferro** com ácidos/alcalinos fortes. Para volumes maiores, o ideal é um tanque com **agitador**. Valores de investimento variam muito — use a **Calculadora de Lucro** para simular.",chips:["Como fazer lote pequeno?","Ferramentas bônus"]},{id:"lote",t:"Como fazer lote pequeno?",q:["como fazer lote pequeno","reduzir a fórmula","quero fazer só 5 litros","fórmula para menos litros","regra de três","diminuir a quantidade","adaptar para menos litros","converter litros","a fórmula é para quantos litros","quantidade para 1 litro","como adaptar a receita","calcular quantidade","fazer menos"],k:["lote pequeno","regra de três","reduzir"],a:'As fórmulas profissionais são calculadas para **100 litros**. Para fazer menos, é uma regra de três: **quantidade ÷ 100 × litros que você quer**. (Ex.: para 10 L, divida tudo por 10; para 5 L, por 20.)\n\n👉 Eu calculo pra você! Diga o produto e o volume, por exemplo: **"quero fazer 10 litros de multiuso"**.\n\nEm lotes pequenos, use balança de precisão e **faça um teste antes** de produzir mais.',chips:["Quero fazer 10 litros de multiuso","Quero fazer 5 litros de sabão líquido"]},{id:"agua",t:"Que água usar?",q:["que água usar","água da torneira serve","água destilada","água de poço","precisa de água deionizada","qual água para fabricar","água filtrada","água dura","posso usar água da torneira"],k:["água dura","deionizada","destilada"],a:'Dá para usar **água comum (torneira/poço)** em muitos produtos, mas a **qualidade da água muda o resultado**. Água muito **dura** (com muito cálcio/magnésio) atrapalha espuma e pode turvar — o **EDTA** ajuda a controlar. Para produtos sensíveis (perfumes, cosméticos, pretinho), prefira água **filtrada, deionizada ou destilada**.\n\nVeja no glossário os itens "Água comum" e "Água deionizada/destilada".',chips:["O que é EDTA?"]},{id:"cor",t:"Que corante usar?",q:["que corante usar","quanto de corante","corante mancha","cor do produto","corante para detergente","qual cor usar","o corante não dissolve","corante sujou a roupa","cor mudou","a cor desbota"],k:["corante"],a:'Use **corantes próprios para produtos de limpeza**, em **pouquíssima quantidade** (q.s. = "quanto baste") e **diluídos antes** em um pouco de água para não manchar nem formar pontos escuros. Corante em excesso pode **manchar roupas e superfícies**.\n\nCada fórmula sugere a cor (veja "Fragrância, Cor e Embalagem"). Se a cor desbotou, pode ser **sol**, pH ou incompatibilidade — guarde ao abrigo da luz.',chips:["Que embalagem usar?"]},{id:"substituir",t:"Posso trocar um ingrediente?",q:["posso trocar um ingrediente","não achei o insumo","posso usar outro tensoativo","tem substituto","o que usar no lugar","trocar marca","substituir o insumo","não encontrei na minha cidade","posso trocar por outro","alternativa para o ingrediente"],k:["substituto","substituir","trocar ingrediente"],a:'Em muitos casos sim. O **glossário** mostra, para cada insumo, a coluna **"Substituto"**. Mas atenção: trocar ingrediente pode mudar **viscosidade, espuma, pH e cheiro**; e a concentração importa (ex.: LESS 27% ≠ LESS 70%).\n\nSempre faça **lote teste pequeno** primeiro. Me pergunte por um insumo específico: **"substituto do LESS"**, por exemplo.',chips:["Substituto do LESS","Glossário de insumos"]},{id:"rende",t:"Quanto rende o produto?",q:["quanto rende","rendimento","posso diluir mais","diluir para render","como diluir","rende quantos litros","dá para colocar mais água","quanto de água adicionar","diluição do produto"],k:["rendimento","diluir"],a:'Cada fórmula tem uma tabela de **Diluição** (uso direto, rendimento 1:1 etc.). Diluir demais enfraquece a limpeza e pode comprometer a conservação.\n\nDiga a fórmula e eu mostro a diluição dela: por exemplo, **"diluição do multiuso tradicional"**.',chips:["Diluição do multiuso tradicional"]},{id:"comecar",t:"Por onde começo?",q:["por onde começo","primeiros passos","sou iniciante o que faço primeiro","nunca fiz o que fazer","como começar do zero","qual fórmula começar","plano para começar","qual a melhor fórmula para iniciar","qual produto vende mais","o que fabricar primeiro","como iniciar o negócio","passo a passo para começar"],k:["começar","iniciar","primeiros passos"],a:'Um caminho simples para começar:\n\n1. **Escolha 1 ou 2 fórmulas de entrada** (as de uso diário, como multiuso, sabão líquido ou shampoo — são as mais vendidas).\n2. Veja os insumos no **glossário** e onde comprar na lista de **fornecedores**.\n3. Faça um **lote teste pequeno** (use "quero fazer 5 litros") e valide cheiro, espuma, viscosidade e pH.\n4. **Venda antes de fabricar em escala:** valide com amostras e pré-encomendas.\n5. Calcule **custo e preço** nas ferramentas bônus.\n6. **Regularize** o negócio com o Guia de Legalização antes de vender em escala.\n\nO capítulo **"Plano de 30 dias"** do Guia de Legalização organiza esse roteiro dia a dia.',chips:["Plano de 30 dias","Como calcular o preço de venda","Quero fazer 5 litros de multiuso"]},{id:"precificar",t:"Como calcular o preço de venda",q:["como calcular o preço de venda","quanto cobrar","como precificar","qual preço vender","calcular custo por litro","quanto de lucro dá","quanto posso ganhar","quanto lucro por litro","margem de lucro","formar preço","que preço cobrar","qual preço cobrar","quanto devo cobrar","preço de venda do litro","quanto vale o litro","como saber meu lucro","dá dinheiro","dá lucro"],k:["precificar","lucro","margem","quanto cobrar"],a:'Para formar preço, some o **custo dos insumos por litro** + **embalagem, rótulo, perdas, frete, impostos e seu tempo**, e aplique a margem que quiser.\n\nCada fórmula mostra o **custo estimado e um argumento de venda** (abra a fórmula ou pergunte "custo do multiuso"). E as ferramentas bônus fazem as contas por você:\n\n• 💰 **Precificação Automática** · 📊 **Calculadora de Lucro**\n\n⚠️ Os valores são **referências**: custos variam por região e fornecedor, e eu não prometo ganhos — faça as contas com os seus números.',chips:["Ferramentas bônus","Custo do multiuso"]},{id:"vender_onde",t:"Como e onde vender?",q:["como vender","onde vender","como conseguir clientes","como divulgar","vender no instagram","vender para mercado","vender na internet","quem compra","estratégia de vendas","primeiros clientes","posso vender para lojas","como achar clientes","preciso de loja","marketing"],k:["vender","clientes","divulgar"],a:'O curso mostra o caminho: **valide antes de fabricar** — apresente amostras e colete pré-encomendas (vizinhança, comércios, condomínios, oficinas, lava-jatos, salões, redes sociais) e só depois produza em escala. Os produtos de **uso diário** têm venda recorrente.\n\nNo Guia de Legalização, o capítulo **"Venda Antes de Fabricar"** detalha isso, e cada fórmula traz um **argumento de venda** pronto. Para vender com segurança, regularize antes de escalar.',chips:["Venda antes de fabricar","Posso vender os produtos?","Como calcular o preço de venda"]},{id:"posso_vender",t:"Posso vender os produtos?",q:["posso vender os produtos","posso vender sem cnpj","preciso de cnpj para vender","preciso de anvisa","posso vender em casa","é legal vender","preciso de licença","vender sem registro","posso vender produto de limpeza feito em casa","qual a lei para vender","preciso de autorização","fabricar em casa para vender"],k:["vender sem cnpj","autorização"],a:"Para **fabricar e vender** produtos de limpeza e automotivos há **exigências legais** (notificação/registro na ANVISA conforme o tipo de produto, rótulo correto, responsável técnico, empresa, licença sanitária etc.). Um caminho mais simples para começar é **revender produtos prontos de fabricantes regularizados**.\n\nO **Guia de Legalização** explica tudo passo a passo, em linguagem simples. As regras variam por produto e município — confirme sempre com os órgãos competentes.",chips:["Posso começar como MEI?","Notificação ANVISA","Guia de Legalização"]},{id:"mei",t:"Posso começar como MEI?",q:["posso começar como mei","mei pode fabricar","sou mei posso fabricar","mei ou me","qual empresa abrir","tipo de empresa","preciso abrir empresa","microempresa","cnpj mei","mei vende produto de limpeza","qual cnpj usar"],k:["mei","me","cnpj"],a:'Sim, dá para **começar estudando as fórmulas e planejando sua linha**. Para vender como **MEI**, um caminho é **revender produtos prontos de fabricantes regularizados**. Já para **fabricar e vender suas próprias fórmulas**, é necessário atuar como **ME** (ou outro porte compatível) e cumprir as exigências de licenciamento e regularização de cada produto.\n\nO curso ensina a parte técnica; ele **não substitui a formalização**. O Guia de Legalização tem o capítulo **"Abrindo Sua Empresa"**.',chips:["Abrir empresa","Notificação ANVISA"]},{id:"guia_leg",comprar:"leg",t:"Guia de Legalização",q:["guia de legalização","o que tem no guia de legalização","legalização","o guia ensina a legalizar","como legalizar meu negócio","regularizar produto","quais capítulos","capítulos do guia","o que ensina a legalização","quero comprar o guia de legalização","como compro o guia","quanto custa o guia de legalização","comprar o guia"],k:["legalização","guia"],a:function(a,o){var e=o.dados().LG||[];return"⚖️ O **Guia de Legalização** tem 9 capítulos:\n\n"+(e.length?e.map(function(a){return a.num+". "+a.title}).join("\n"):"1. Os 3 Caminhos para Começar\n2. Venda Antes de Fabricar\n3. O Que Você Pode Vender\n4. Notificação ANVISA P "qual e-mail uso no clube","preciso de senha no clube","login do clube"],k:["entrar clube"],a:"Para entrar no Clube, digite o **mesmo e-mail da sua compra** (de qualquer um dos cursos). Não precisa de senha. 🔓\n\nSe aparecer que o e-mail não foi encontrado: confira a digitação, tente o outro e-mail que você possa ter usado, e se ainda assim não entrar, **chame o suporte** (**"+o+"**). Quem ainda não é aluno pode conhecer os cursos na própria tela de entrada.",btns:["wa"],chips:["Esqueci qual e-mail usei","Paguei e não liberou"]},{id:"c_postar",t:"Como postar no clube?",only:e,q:["como postar no clube","como criar uma publicação","como faço uma pergunta","como publicar","como tirar dúvida no clube","onde escrevo minha dúvida","botão de nova publicação","como postar uma foto","nova publicação","criar post","como compartilhar meu resultado"],k:["postar","publicar","nova publicação"],a:"Toque no botão **+ / Nova publicação**, escolha a **categoria**, escreva o título (opcional) e o texto, e se quiser **anexe até 3 fotos**. Depois é só publicar! ✍️\n\nCategorias:\n• **Dúvidas** — perguntas sobre fórmulas e produção\n• **Resultados** — mostre o que você fez\n• **Dicas e receitas** — compartilhe o que aprendeu\n• **Avisos da equipe** — novidades (só a equipe publica)\n\nDica: numa dúvida, conte **qual fórmula, o que fez, o que esperava e o que aconteceu**. Assim a resposta vem mais rápida!",chips:["Por que minha publicação foi bloqueada?","Regras do clube"]},{id:"c_comentar",t:"Como comentar e curtir?",only:e,q:["como comentar","como responder uma dúvida","como curtir","como responder um post","posso comentar com foto","curtir publicação","responder alguém","enviar foto no comentário"],k:["comentar","curtir","responder"],a:"Abra a publicação, escreva no campo de comentário (dá para **anexar uma foto**) e envie. Para curtir, toque no **coração** ♡ da publicação. 💬",chips:["Melhor resposta e dúvida resolvida","Regras do clube"]},{id:"c_resolvido",t:"Melhor resposta e dúvida resolvida",q:["melhor resposta","marcar como resolvido","dúvida resolvida","fechar dúvida","como marco a melhor resposta","quem marca como resolvida","o que significa resolvido","selo de resolvido"],k:["resolvido","melhor resposta"],only:e,a:"Quando alguém responde sua dúvida, você pode marcar essa resposta como **melhor resposta** ✅ — a dúvida fica marcada como **resolvida** e ajuda quem tiver o mesmo problema depois. Só **quem perguntou** (ou a equipe) pode marcar ou desmarcar.",chips:["Como postar no clube?"]},{id:"c_bloqueada",t:"Por que minha publicação foi bloqueada?",only:e,q:["por que minha publicação foi bloqueada","não consigo postar link","não deixa colocar telefone","não aceita meu comentário","erro ao publicar","não deixa postar","limite de publicações","posso colocar meu instagram","posso divulgar meu produto","posso colocar whatsapp","posso colocar link","post foi apagado","meu post sumiu","foi removida"],k:["bloqueada","link","divulgar","removida"],a:"O Clube não é espaço de divulgação, então **links, @perfis e telefones não são aceitos** nas publicações e comentários. Se aparecer erro ao publicar, veja se seu texto tem algum desses itens.\n\nExistem também limites contra spam: até **5 publicações por hora** e **30 comentários por hora**. Se sua publicação sumiu, ela pode ter sido removida pela equipe por quebrar os combinados — fale com o João se achar que foi engano.",btns:["wa"],chips:["Regras do clube"]},{id:"c_regras",t:"Regras do clube",only:e,q:["regras do clube","combinados","o que pode e o que não pode","regras da comunidade","posso postar qualquer coisa","o que é proibido","termos de uso do clube","comportamento"],k:["regras","combinados","proibido"],a:"📜 **Combinados do Clube:**\n\n• Respeite todos: aqui todo mundo está aprendendo.\n• Sem links, @perfis ou telefones — aqui não é espaço de divulgação.\n• Descreva sua dúvida com detalhes (o que fez, o que esperava, o que aconteceu).\n• Não peça nem passe o conteúdo dos cursos para quem não é aluno.\n• Segurança em primeiro lugar: use luvas e ventilação ao testar fórmulas.\n\nPublicações que quebram os combinados podem ser removidas.",chips:["Como denunciar?"]},{id:"c_denunciar",t:"Como denunciar?",only:e,q:["como denunciar","denunciar publicação","denunciar comentário","alguém está me ofendendo","conteúdo inadequado","reportar post","tem spam","tem alguém fazendo propaganda","conteúdo ofensivo","bloquear alguém"],k:["denunciar","reportar","ofensa"],a:"Em qualquer publicação ou comentário, toque no menu **⋯** e escolha **Denunciar**. A equipe analisa e remove o que quebrar os combinados — a denúncia é discreta. 🚩\n\nSe for algo urgente ou grave, avise também o João pelo WhatsApp **"+o+"**.",btns:["wa"]},{id:"c_apagar",t:"Como apagar minha publicação?",only:e,q:["como apagar minha publicação","excluir post","apagar comentário","editar minha publicação","posso editar o post","errei no post","remover meu comentário","deletar publicação"],k:["apagar","excluir","editar"],a:"Nas suas próprias publicações e comentários, toque no menu **⋯** e escolha **Apagar**. Por enquanto não dá para editar o texto depois de publicado: se errou, apague e publique de novo. 🗑️",chips:["Como postar no clube?"]},{id:"c_perfil",t:"Como mudar meu nome / avisos?",only:e,q:["como mudar meu nome","trocar nome no clube","perfil","avisos por e-mail","parar de receber e-mails","não quero receber e-mail","notificações do clube","como sair do clube","desativar avisos","editar perfil","meu nome aparece errado","sair"],k:["perfil","nome","avisos","notificações"],a:"Toque no seu **nome/foto no topo** para abrir o **Perfil**. Lá você pode:\n\n• Trocar o **nome exibido**\n• Ligar/desligar os **avisos por e-mail** quando alguém responder suas publicações\n• Ver os **combinados**\n• **Sair** da conta\n\nSeu perfil mostra um selo do(s) curso(s) que você tem.",chips:["Regras do clube"]},{id:"c_selo",t:"O que é o selo do curso?",only:e,q:["o que é o selo","selo do curso","etiqueta no perfil","o que significa o selo","por que aparece fdl ou ap","aluno de qual curso","selos","equipe"],k:["selo","equipe"],a:"O selo ao lado do nome mostra **de qual curso a pessoa é aluna** (Fábrica da Limpeza, Auto Pro…), para você saber o contexto de quem está respondendo. Respostas com o selo **Equipe** vêm do time do João. ✅",chips:["Como comentar e curtir?"]},{id:"c_instalar",t:"Como instalar o clube no celular?",only:e,q:["como instalar o clube","instalar a comunidade no celular","colocar o clube na tela inicial","baixar o clube","tem app do clube","clube na tela de início","instalar no iphone o clube","instalar no android o clube"],k:["instalar clube"],a:"O Clube também pode virar um app na sua tela inicial:\n\n**iPhone (Safari):** toque em **⬆ Compartilhar → Adicionar à Tela de Início → Adicionar**.\n**Android (Chrome):** toque nos **⋮ → Instalar aplicativo → Instalar**.\n\n⚠️ No iPhone, abra pelo **Safari** (não funciona dentro do navegador do WhatsApp/Instagram).",btns:[{l:"📲 Instalar agora",install:1}]},{id:"c_gratis",t:"O clube é pago?",only:e,q:["o clube é pago","quanto custa o clube","preciso pagar para entrar","é grátis o clube","tem mensalidade o clube","clube é gratuito","custo da comunidade"],k:["clube pago","clube grátis"],a:"O Clube da Renda Extra é **exclusivo para alunos** dos cursos, sem custo extra — basta entrar com o e-mail da sua compra. 🎉",chips:["Como entro no clube?"]},{id:"c_cursos",t:"Quais cursos existem?",only:e,q:["quais cursos existem","quais são os cursos","qual a diferença entre os cursos","fábrica da limpeza ou auto pro","qual curso é melhor","quero comprar um curso","cursos disponíveis","quero conhecer os cursos","qual curso escolher","linha automotiva","linha de limpeza"],k:["cursos","auto pro","fábrica da limpeza"],a:function(a){return{text:"🧪 Os cursos do João Silva:\n\n"+a.apps.map(function(a){return"• **"+a.nome+"** — "+a.desc}).join("\n")+"\n\nQuer ver os apps? Toque num dos botões. Se ainda não é aluno, também consigo te levar para o
